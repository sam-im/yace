<html>
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type"/>
    <style>
      body {
          display: flex;
          flex-direction: column;
          align-items: center;
      }
      canvas {
          border: 1px solid black;
          margin-bottom: 10px;
      }
      .keypad {
          display: grid;
          grid-template-columns: repeat(3, 60px);
          gap: 5px;
      }
      select {
          margin-top: 10px;
          padding: 5px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="keypad">
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>7</button>
      <button>8</button>
      <button>9</button>
    </div>
    <div class=select-rom>
      <select id="select-rom">
        <option value="example1">Example Rom 1</option>
      </select>
      <button>Upload ROM</button>
    </div>

    <script type="module">
      import init from './chip8_wasm.js';

      async function run() {
        await init();
      }

      run();
    </script>
  </body>
</html>
